name: Refresh dashboard data

# Re-runs update_data.py on a schedule and pushes the refreshed
# data.js / data.json snapshot back to main. GitHub Pages picks up
# the change automatically.
on:
  schedule:
    # 22:30 UTC every weekday ≈ 6:30pm EDT / 5:30pm EST — well after
    # US market close so Yahoo's daily bars have settled.
    - cron: '30 22 * * 1-5'
  workflow_dispatch:  # also runnable manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh data
        run: python update_data.py

      - name: Commit and push if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js data.json
          if git diff --staged --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "Auto-refresh data ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
